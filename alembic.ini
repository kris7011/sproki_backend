# A generic, single database configuration.

[alembic]
# path to migration scripts.
script_location = migrations

# ensure alembic kan importere 'app' pakken
prepend_sys_path = .

# Use os.pathsep (":" på macOS/Linux) for evt. flere paths
path_separator = os

# database URL. Vi lader env.py sætte den fra DATABASE_URL eller app.db.
# Lad denne stå tom; env.py udfylder den dynamisk.
sqlalchemy.url =

[post_write_hooks]
# (valgfrit) eksempel på hooks til black/ruff efter revision genereres
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88 REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
