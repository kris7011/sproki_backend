services:
  - type: web
    name: sproki-backend
    runtime: docker
    plan: free            # skift til "starter" for at undgå cold starts
    region: frankfurt
    autoDeploy: true
    disk:
      name: dbdisk
      mountPath: /data
      sizeGB: 1
    envVars:
    - key: REQUIRE_SUPABASE
      value: "1"
    - key: ALLOW_DEBUG
      value: "0"
