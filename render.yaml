services:
  - type: web
    name: sproki-backend
    runtime: docker            # (ikke "env: docker")
    plan: free                 # brug "starter" hvis du vil undgå cold starts
    region: frankfurt
    autoDeploy: true
    disk:
      name: dbdisk
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/sproki_reports.db   # 4 skråstreger efter sqlite:
