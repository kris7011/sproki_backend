services:
  - type: web
    name: sproki-backend
    runtime: docker
    plan: free            # skift til "starter" for at undgå cold starts
    region: frankfurt
    autoDeploy: true
    disk:
      name: dbdisk
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/sproki_reports.db   # 4 skråstreger (SQLite absolut sti)
      - key: UPLOAD_DIR
        value: /data/uploads
